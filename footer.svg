<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="150"
     viewBox="0 0 1200 150">

  <defs>
    <!-- Soft lavender glow -->
    <radialGradient id="lavender">
      <stop offset="0%" stop-color="#756A9F" stop-opacity=".28"/>
      <stop offset="65%" stop-color="#756A9F" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#756A9F" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft blue glow -->
    <radialGradient id="blue">
      <stop offset="0%" stop-color="#35466B" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#35466B" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Transparent background: blends with GitHub -->

  <!-- Slowly moving cosmic light -->
  <g filter="url(#glow)">
    <ellipse cx="300" cy="65" rx="250" ry="65"
             fill="url(#lavender)">
      <animate attributeName="cx"
        values="300;650;950;300"
        dur="32s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="900" cy="80" rx="260" ry="60"
             fill="url(#blue)">
      <animate attributeName="cx"
        values="900;550;200;900"
        dur="38s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Tiny blinking stars -->
  <g fill="#D8DDF5">

    <circle cx="55" cy="30" r="1.3">
      <animate attributeName="opacity"
        values=".15;1;.2;.8;.15"
        dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>

    <circle cx="145" cy="95" r="1.5" fill="#B9A8F5">
      <animate attributeName="opacity"
        values=".1;.9;.15;1;.1"
        dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="230" cy="48" r="1">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="3.5s" begin=".5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="325" cy="118" r="1.5" fill="#9CCBFA">
      <animate attributeName="opacity"
        values=".1;1;.15"
        dur="4.8s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="415" cy="24" r="1.2">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="5.5s" begin=".8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="505" cy="85" r="1.4" fill="#B9A8F5">
      <animate attributeName="opacity"
        values=".1;.9;.1"
        dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <circle cx="610" cy="35" r="1.5">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="6s" begin=".3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="710" cy="112" r="1.2" fill="#9CCBFA">
      <animate attributeName="opacity"
        values=".1;1;.2"
        dur="4.5s" begin="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="810" cy="42" r="1.5" fill="#B9A8F5">
      <animate attributeName="opacity"
        values=".2;1;.1"
        dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <circle cx="920" cy="90" r="1.2">
      <animate attributeName="opacity"
        values=".1;.9;.2"
        dur="3.8s" begin="2.2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1030" cy="27" r="1.5" fill="#9CCBFA">
      <animate attributeName="opacity"
        values=".1;1;.1"
        dur="5.2s" begin=".6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1135" cy="105" r="1.4" fill="#B9A8F5">
      <animate attributeName="opacity"
        values=".2;1;.2"
        dur="4.2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1160" cy="48" r="1">
      <animate attributeName="opacity"
        values=".1;.8;.1"
        dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Small twinkling star crosses -->
  <g fill="#B9A8F5">
    <path d="M380 50 L382 56 L388 58 L382 60 L380 66 L378 60 L372 58 L378 56Z">
      <animate attributeName="opacity"
        values=".15;1;.15"
        dur="4s" repeatCount="indefinite"/>
    </path>

    <path d="M850 100 L852 105 L857 107 L852 109 L850 114 L848 109 L843 107 L848 105Z">
      <animate attributeName="opacity"
        values=".1;.9;.1"
        dur="5s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Footer signature -->
  <g text-anchor="middle" font-family="Georgia, serif"
     font-style="italic">

    <text x="600" y="72"
          fill="#D8DDF5"
          font-size="21"
          opacity=".95">
      THANKS FOR VISITING
    </text>

    <text x="600" y="98"
          fill="#756A9F"
          font-size="11"
          letter-spacing="4">
      ✦ github.com/ourelliey ✦
    </text>

  </g>

</svg>
