<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320"
     viewBox="0 0 1200 320">

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#17233B"/>
      <stop offset="100%" stop-color="#25213D"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#35466B"/>
      <stop offset="45%" stop-color="#756A9F"/>
      <stop offset="75%" stop-color="#9A88C5"/>
      <stop offset="100%" stop-color="#35466B"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="16s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#B9A8F5" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#B9A8F5" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="45"/>
    </filter>

    <pattern id="stars" width="120" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#D8DDF5" opacity=".4"/>
      <circle cx="90" cy="65" r=".8" fill="#B9A8F5" opacity=".35"/>
      <circle cx="55" cy="90" r=".7" fill="#9CCBFA" opacity=".3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#base)"/>

  <!-- Moving Aurora Lights -->
  <g filter="url(#blur)">
    <ellipse cx="200" cy="120" rx="250" ry="100"
             fill="#35466B" opacity=".55">
      <animate attributeName="cx"
        values="200;700;1050;200"
        dur="20s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="900" cy="100" rx="260" ry="120"
             fill="#756A9F" opacity=".55">
      <animate attributeName="cx"
        values="900;450;100;900"
        dur="22s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="600" cy="270" rx="300" ry="65"
             fill="#9CCBFA" opacity=".18">
      <animate attributeName="cx"
        values="600;900;350;600"
        dur="24s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Aurora Ribbon -->
  <path d="M-100 260 Q250 120 500 220 T1000 170 T1400 230"
        stroke="url(#aurora)"
        stroke-width="85"
        fill="none"
        opacity=".16"
        filter="url(#blur)">
    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;0 -25;0 0;0 25;0 0"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- Star Texture -->
  <rect width="1200" height="320" fill="url(#stars)"/>

  <!-- Typography -->
  <g font-family="Arial, sans-serif"
     text-anchor="middle">

    <text x="600" y="76"
          fill="#B9A8F5"
          font-size="13"
          letter-spacing="7">
      PERSONAL PORTFOLIO
    </text>

    <text x="600" y="145"
          fill="#F5F0FF"
          font-size="43"
          font-weight="bold"
          letter-spacing="1">
      AURELLIA NABILA
    </text>

    <text x="600" y="195"
          fill="#D8DDF5"
          font-size="43"
          font-weight="bold"
          letter-spacing="1">
      RAHMA PUTRI
    </text>

    <rect x="480" y="220"
          width="240" height="2"
          rx="1"
          fill="#B9A8F5"
          opacity=".75"/>

    <text x="600" y="249"
          fill="#C5D0E6"
          font-size="13"
          letter-spacing="3">
      COMPUTER ENGINEERING STUDENT
    </text>

    <text x="600" y="276"
          fill="#9CCBFA"
          font-size="11"
          letter-spacing="2">
      WEB DEVELOPMENT · IoT · EMBEDDED SYSTEMS
    </text>

  </g>
</svg>
